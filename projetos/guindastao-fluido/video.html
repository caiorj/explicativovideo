<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>1-Math.pow(1-clamp(x),3);let boards=[],captions=[],last=-1,nodes=[],notes=[];const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');window.init=(a,b)=>{boards=a;captions=b};
window.render=t=>{let i=boards.findIndex(s=>t>=s.a&&t<s.b);if(i<0)i=boards.length-1;const b=boards[i],u=t-b.a;const out=i===boards.length-1?1:clamp((b.b-t)/.12);let title=document.querySelector('#title');title.innerHTML=b.title.map((x,j)=>`<div class="${j===1?'accent':''}">${esc(x)}</div>`).join('');let titleSize=85;title.style.fontSize=titleSize+'px';while(title.scrollWidth>930&&titleSize>45){title.style.fontSize=(--titleSize)+'px';}title.style.opacity=out;title.style.transform=`translateY(${12*(1-ease(u/.35))}px)`;document.querySelector('#underline').style.width='0px';
const drawing=document.querySelector('#board');drawing.innerHTML=window.evolution(t).html;
const active=[...drawing.querySelectorAll('.ink')].find(n=>+n.dataset.progress<1);const marker=document.querySelector('#marker');if(active){const local=active.getPointAtLength(active.getTotalLength()*+active.dataset.progress);const pt=new DOMPoint(local.x,local.y).matrixTransform(active.getCTM());marker.setAttribute('transform',`translate(${pt.x} ${pt.y})`);marker.style.opacity=1;}else{marker.style.opacity=0;}
 const c=captions.find(([a,b])=>t>=a&&t<b),cap=document.querySelector('#captions');cap.style.display=c?'block':'none';cap.innerHTML=c?esc(c[2]).replace(/(equipamento|empresa qualificada|planejamento|capacitados|inspecionados|comunicação clara|mais segura|menos imprevistos|previsibilidade|preparo|responsabilidade|Guindastão|segurança operacional)/gi,'<em>$1</em>'):'';};

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>1-Math.pow(1-clamp(x),3);let scenes=[],captions=[];const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');window.init=(a,b)=>{scenes=a;captions=b};const notes=['VOCÊ AVALIA TUDO O QUE A OPERAÇÃO EXIGE?','MUITO ALÉM DO EQUIPAMENTO','PESO · DIMENSÕES · ALCANCE','ACESSO · APOIO · CONDIÇÕES DO TERRENO','EQUIPAMENTO ADEQUADO PARA CADA ETAPA','PROFISSIONAIS CAPACITADOS','INSPEÇÃO E COMUNICAÇÃO ENTRE EQUIPES','CUIDADO COM PESSOAS, CARGAS E INSTALAÇÕES','MENOR RISCO DE DANOS · MAIS PREVISIBILIDADE','PRIMEIRO O PLANO. DEPOIS A EXECUÇÃO.','COMPROMISSO COM O RESULTADO',''];window.render=t=>{let i=scenes.findIndex(s=>t>=s.a&&t<s.b);if(i<0)i=scenes.length-1;let s=scenes[i],u=t-s.a;let a=ease(u/.4)*(i===11?1:clamp((s.b-t)/.13));document.querySelector('#topic').textContent=s.eyebrow;const h=document.querySelector('#title');h.innerHTML=s.title.map((v,j)=>`<div class="${j===s.accent?'accent':''}">${esc(v)}</div>`).join('');h.style.fontSize=s.title.some(v=>v.length>22)?'76px':s.title.length===3?'78px':'88px';h.style.opacity=a;h.style.transform=`translateY(${14*(1-ease(u/.45))}px)`;window.drawScene(i,t,u,a);document.querySelector('#stageLabel').textContent=notes[i];document.querySelector('#stageLabel').style.opacity=a;document.querySelector('#heroLogo').style.opacity=i===11?ease(u/.7):0;document.querySelector('#call').style.opacity=i===11?ease((u-.15)/.7):0;document.querySelector('#brand').style.opacity=i===11?0:1;const c=captions.find(([a,b])=>t>=a&&t<b),cap=document.querySelector('#captions');cap.style.display=c?'block':'none';cap.innerHTML=c?esc(c[2]).replace(/(equipamento|empresa qualificada|planejamento|capacitados|inspecionados|comunicação clara|mais segura|menos imprevistos|previsibilidade|preparo|responsabilidade|Guindastão|segurança operacional)/gi,'<em>$1</em>'):'';};

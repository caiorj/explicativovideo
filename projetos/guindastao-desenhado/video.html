 for(const n of nodes){const part=Math.max(70,Math.min(650,+n.dataset.length))/total*drawTime;let p=clamp((u-elapsed)/part);n.style.strokeDashoffset=1-p;n.setAttribute('fill',n.dataset.originalFill);n.style.fillOpacity=clamp((p-.78)/.22);if(p>0&&p<1){active=n;ap=p;}elapsed+=part;}

 const c=captions.find(([a,b])=>t>=a&&t<b),cap=document.querySelector('#captions');cap.style.display=c?'block':'none';cap.innerHTML=c?esc(c[2]).replace(/(equipamento|empresa qualificada|planejamento|capacitados|inspecionados|comunicação clara|mais segura|menos imprevistos|previsibilidade|preparo|responsabilidade|Guindastão|segurança operacional)/gi,'<em>$1</em>'):'';};
